# Host app for Harper engineering's shared agent memory.
# The plugin brings its tables, resources and MCP surface; identity is Harper users and roles.
# models.embedding.default / models.generative.default come from the GPU host's local vLLM
# (injected into the root config by host-manager), so the plugin's "default" model names resolve there.
jsResource:
  files: 'resources.js'

'@harperfast/agent-memory':
  package: '@harperfast/agent-memory'
  embeddingModel: nomic-prefixed
  # vLLM cuts only when each node's models.embedding.default entry sets truncation: 'vllm'; until then the plugin
  # embeds the first limits.embeddingFallbackChars (default 4000) characters (README, Embedding truncation).
  embeddingTruncate: true
  mcp: true
  # The engineering cluster runs with replication.recordLocks on.
  lockScope: cluster
  supersession:
    mode: suggest
  limits:
    # vLLM cuts each input at nomic's 2,048 tokens; this only bounds the request. 12,000 is above what 2,048
    # tokens of English prose cover, so the model decides the cut. Back to 4000 if embeddingTruncate goes off.
    embeddingInputChars: 12000

'@harperfast/summary-tree':
  package: '@harperfast/summary-tree'
  generativeModel: default
  # vLLM serves the generative model with max-model-len 32768.
  contextTokens: 32768
  # Reuses the vectors agent-memory stored; "default" would re-embed every memory without nomic's prefix.
  embeddingModel: nomic-prefixed
  mcp: true

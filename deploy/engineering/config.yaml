# Host app for Harper engineering's shared agent memory (agent-memory.engineering.harperfabric.com).
# The plugin brings its tables, resources and MCP surface; identity is Harper users and roles.
# models.embedding.default / models.generative.default come from the GPU host's local vLLM
# (injected into the root config by host-manager), so the plugin's "default" model names resolve there.
jsResource:
  files: 'resources.js'

'@harperfast/agent-memory':
  package: '@harperfast/agent-memory'
  embeddingModel: nomic-prefixed
  mcp: true
  supersession:
    mode: suggest
  limits:
    # The engineering nomic model holds 2,048 tokens; 6,000 characters of token-dense content (code, IDs)
    # exceeds that. 4,000 fits down to 2 characters per token. Token-exact bounding: #28.
    embeddingInputChars: 4000

# In the plugin's database: a sink's writes are atomic with the memory only there.
type SinkLog @table(database: "memory") {
	id: ID @primaryKey
	kind: String
	memoryId: String
	status: String
	revision: Int
}

# A host table with the plugin's table name, in the host's own database; the plugin must never touch it.
type Memory @table {
	id: ID @primaryKey
	note: String
}

# Not @export-ed: every read and write goes through the Memory resource (src/), which is the single
# enforcement point for ownership and scope rules. See DESIGN.md. audit: true is required by @fullText.

type Memory @table(database: "memory", audit: true) {
	id: ID @primaryKey
	title: String
	content: String
	tags: [String] @indexed
	scopes: [String] @indexed
	ownerId: String @indexed
	status: String @indexed # active | superseded | withdrawn
	revision: Int
	supersedes: [ID] @indexed
	# The subset of supersedes the auto judge added, so an identical retry compares only what the author sent.
	autoSupersedes: [ID]
	supersededBy: ID @indexed
	evidence: Any
	evidenceMemoryIds: [ID] @indexed
	needsReview: Any # { since, cause: superseded | withdrawn, sourceId, replacementId? }
	# needsReview.since, indexed because Harper does not index object values; never in a view.
	needsReviewSince: Date @indexed
	confirmed: Any # { by, at }
	author: Any
	lastEditor: Any
	validUntil: Date
	withdrawnAt: Date
	withdrawnReason: String
	# The plugin installs its own embedder for every model; it embeds with the model recorded on the row.
	embedding: [Float] @embed(source: "content", model: "default")
	embeddingModel: String @indexed
	text: FullText @fullText(fields: [{ name: "title", weight: 2.0 }, { name: "content" }])
	createdAt: Date @indexed
	updatedAt: Date @updatedTime @indexed
}

type MemoryPin @table(database: "memory") @sealed {
	id: ID @primaryKey
	principalId: String @indexed
	memoryId: ID @indexed
	createdAt: Date @indexed
}

# Keyed "role:<roleName>" or "user:<username>". Patterns are exact labels or "<namespace>:*".
type ScopeGrant @table(database: "memory") {
	id: ID @primaryKey
	read: [String]
	write: [String]
	updatedAt: Date @updatedTime
}

type MemoryWatch @table(database: "memory") {
	id: ID @primaryKey
	principalId: String @indexed
	memoryId: ID @indexed
	expiresAt: Date @expiresAt
}

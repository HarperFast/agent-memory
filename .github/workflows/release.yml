name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; the Node 22 runner ships npm 10.x.
      - run: npm install -g npm@^11.5.1

      - run: npm ci
      - run: npm run format:check
      - run: npm test

      # A release can be cut from any commit, not only one test.yml already ran on, and the
      # integration suite is what exercises the packed tarball inside a real Harper.
      - run: npm run install:fixtures
      - run: npm run test:integration
        timeout-minutes: 10

      # Prereleases (tags like v0.2.0-beta.1) go to the `next` dist-tag so they don't move `latest`.
      - name: Determine npm dist-tag
        id: disttag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG_NAME" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Auth is npm trusted publishing (OIDC) via id-token: no NODE_AUTH_TOKEN/secret. Configured at
      # npmjs.com: Trusted Publisher -> HarperFast/agent-memory, release.yml, Release environment.
      # prepack builds dist/ without source maps.
      - run: npm publish --provenance --access public --tag "${{ steps.disttag.outputs.tag }}"
